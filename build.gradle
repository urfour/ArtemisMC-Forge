plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

// Modern Minecraft 1.21.1 / NeoForge requires Java 21
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    // Specify the NeoForge version
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Replace version and other properties in mods.toml at build time
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_version            : project.mod_version,
            mod_name               : project.mod_name,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description,
            mod_license            : 'MIT'
    ]
    inputs.properties(replaceProperties)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}
